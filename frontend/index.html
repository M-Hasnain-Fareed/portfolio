    <!-- Glassmorphism Tilt & Green Spotlight Effect Handler -->
    <script>
        document.addEventListener('mousemove', (e) => {
            const tiles = document.querySelectorAll('.glass-tile, .portfolio-card, .section-card'); // Targets tiles dynamically
            tiles.forEach(tile => {
                const rect = tile.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Pass coordinates for green glow
                tile.style.setProperty('--mouse-x', `${x}px`);
                tile.style.setProperty('--mouse-y', `${y}px`);

                // Check if mouse is hovering over this specific tile for 3D tilt
                if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = -((y - centerY) / centerY) * 8; // Tilt intensity
                    const rotateY = ((x - centerX) / centerX) * 8;

                    tile.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
                } else {
                    tile.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
                }
            });
        });
    </script>
