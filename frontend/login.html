<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div style="background: var(--card-bg); border: 1px solid var(--border-color); padding: 3rem; border-radius: 14px; width: 100%; max-width: 400px;">
            <h2 style="margin-bottom: 1.5rem; font-size: 1.8rem;">Admin Login.</h2>
            <form id="login-form" style="display: flex; flex-direction: column; gap: 1.2rem;">
                <div>
                    <label style="display: block; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem;">Username</label>
                    <input type="text" id="username" required style="width: 100%; padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 8px;">
                </div>
                <div>
                    <label style="display: block; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem;">Password</label>
                    <input type="password" id="password" required style="width: 100%; padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 8px;">
                </div>
                <button type="submit" class="btn-primary" style="justify-content: center; margin-top: 1rem; border: none; cursor: pointer;">Login</button>
                <p id="error-msg" style="color: var(--accent-color); font-size: 0.85rem; text-align: center; display: none;"></p>
            </form>
        </div>
    </main>

    <script>
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errorMsg = document.getElementById("error-msg");

            const formData = new URLSearchParams();
            formData.append("username", username);
            formData.append("password", password);

            try {
                const res = await fetch("/api/admin/login", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();

                if (res.ok) {
                    window.location.href = "/admin";
                } else {
                    errorMsg.textContent = data.detail || "Invalid login credentials";
                    errorMsg.style.display = "block";
                }
            } catch (err) {
                errorMsg.textContent = "Server connection error.";
                errorMsg.style.display = "block";
            }
        });
    </script>
</body>
</html>
